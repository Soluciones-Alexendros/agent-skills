# actionlint plus secret scanning.
# Both jobs run on every pull request and every push to main. A required
# check with a paths filter does not report on unrelated PRs, so branch
# protection either waits forever or the check is skipped. actionlint is
# cheap; run it every time and keep the check name stable.
# Pins were checked on 2026-09-23. Re-verify before copying.
name: Workflow lint and secrets

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint v1.7.12
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "checksum is pinned for x86_64 only; resolve the ${arch} asset from the same release"
            exit 1
          fi
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          mkdir -p "$HOME/.local/bin"
          mv actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

      # Local equivalent, after installing the same pinned release:
      #   actionlint -color
      # or, with a digest you have verified:
      #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Comments only on pull requests. pull-requests: write is what
          # those comments use; push runs still scan, without commenting.
          GITLEAKS_ENABLE_COMMENTS: ${{ github.event_name == 'pull_request' }}
          # SARIF artifacts can contain the secret material. Keep findings
          # in the job log and job summary, not in a downloadable artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Organization accounts need secrets.GITLEAKS_LICENSE. Personal
          # accounts must omit it. Do not commit a license value.
