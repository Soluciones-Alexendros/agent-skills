# Publish a GitHub Release from an annotated tag vX.Y.Z.
# Release notes come only from the matching CHANGELOG.md section.
# Pins were checked on 2026-09-23. Re-verify before copying.
# Never commit a placeholder pin or a floating tag.
# After the release PR lands: run Fase F (references/merge-watch.md) before
# creating the annotated tag / gh release create.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag vX.Y.Z que origina la release (por defecto: github.ref_name)"
        required: false
        default: ""
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag, changelog, and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, changelog, and manifest
        id: check
        env:
          TAG_NAME: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              tomllib = None

          tag = os.environ["TAG_NAME"]
          if not tag.startswith("v"):
              sys.exit(f"tag {tag!r} must start with v")
          version = tag[1:]
          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$"
          )
          if not semver.fullmatch(version):
              sys.exit(f"tag version {version!r} is not SemVer")

          changelog = Path("CHANGELOG.md")
          if not changelog.is_file():
              sys.exit("CHANGELOG.md is missing")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})(.*)$"
          )
          matched = False
          for line in changelog.read_text(encoding="utf-8").splitlines():
              found = heading.match(line)
              if not found:
                  continue
              if "YANKED" in found.group(2):
                  sys.exit(f"{version} is YANKED; do not publish it again")
              matched = True
              break
          if not matched:
              sys.exit(f"CHANGELOG.md has no dated section for {version}")

          versions = []

          package_json = Path("package.json")
          if package_json.is_file():
              data = json.loads(package_json.read_text(encoding="utf-8"))
              if "version" not in data:
                  sys.exit("package.json has no version")
              versions.append(("package.json", str(data["version"])))

          pyproject = Path("pyproject.toml")
          if pyproject.is_file():
              if tomllib is None:
                  sys.exit("Python tomllib is required to read pyproject.toml")
              data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
              project = data.get("project") or {}
              dynamic = project.get("dynamic") or []
              if "version" in dynamic:
                  sys.exit("pyproject.toml version is dynamic; resolve it before release")
              found_version = project.get("version")
              if not isinstance(found_version, str):
                  poetry = (data.get("tool") or {}).get("poetry") or {}
                  found_version = poetry.get("version")
              if not isinstance(found_version, str):
                  sys.exit("pyproject.toml has no static version")
              versions.append(("pyproject.toml", found_version))

          cargo = Path("Cargo.toml")
          if cargo.is_file():
              if tomllib is None:
                  sys.exit("Python tomllib is required to read Cargo.toml")
              data = tomllib.loads(cargo.read_text(encoding="utf-8"))
              package = data.get("package") or {}
              found_version = package.get("version")
              if not isinstance(found_version, str):
                  sys.exit("Cargo.toml version is missing or inherited; resolve it before release")
              versions.append(("Cargo.toml", found_version))

          go_mod = Path("go.mod")
          if go_mod.is_file() and not versions:
              print("go.mod has no version field; the tag is the module version")
          elif not versions and not go_mod.is_file():
              sys.exit("no supported manifest; do not treat version coherence as verified")

          for name, manifest_version in versions:
              if manifest_version != version:
                  sys.exit(f"{name} version {manifest_version} != tag {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
          PY

  release:
    name: Create GitHub Release
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from pathlib import Path

          version = os.environ["VERSION"]
          if not version or "\n" in version:
              sys.exit("refusing empty or multiline version")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          notes = []
          capture = False
          for line in lines:
              if line.startswith("## ["):
                  if capture:
                      break
                  if line.startswith(f"## [{version}]"):
                      capture = True
                  continue
              if capture:
                  notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              sys.exit(f"empty release notes for {version}")
          Path("notes.md").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag

  # Uncomment for a critical release. Build the artifact in this job
  # or download the one produced by CI. Do not grant these permissions
  # on the release job.
