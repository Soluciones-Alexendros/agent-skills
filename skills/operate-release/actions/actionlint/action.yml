name: actionlint
description: "Instala el actionlint pineado (checksum SHA-256) y lintea los workflows"
inputs:
  version:
    description: "Versión de actionlint"
    required: false
    default: "1.7.12"
  sha256:
    description: "SHA-256 del asset linux_amd64 de esa release"
    required: false
    default: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
        ACTIONLINT_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        arch="$(uname -m)"
        if [ "$arch" != "x86_64" ]; then
          echo "checksum is pinned for x86_64 only; resolve the ${arch} asset from the same release"
          exit 1
        fi
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" actionlint
        mkdir -p "$HOME/.local/bin"
        mv actionlint "$HOME/.local/bin/actionlint"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Lint workflows
      shell: bash
      run: actionlint -color
