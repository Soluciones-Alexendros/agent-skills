# Node.js example (npm + package-lock.json + .nvmrc). Do not copy onto
# Python, Rust, or Go. Adapt setup and commands:
#   Python: actions/setup-python, install from the lockfile, pytest
#   Rust: pinned toolchain action or rustup, cargo test --locked
#   Go: actions/setup-go, go test ./...
# Pins below were checked on 2026-09-23 against the upstream repo (not a fork)
# and the release tag in the comment. Re-verify with references/actions-security.md
# before committing a copy. Never commit a placeholder pin or a floating tag.
#
# After shipping CI hardening via PR: the agent MUST run Fase F
# (references/merge-watch.md) — watch required checks and merge. That loop is
# part of /operar-release, not a separate user ask.
name: CI

on:
  workflow_call:
    inputs:
      node-version-file:
        description: "Fichero con la versión de Node (.nvmrc por defecto)"
        required: false
        default: ".nvmrc"
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - run: npm ci
      - name: Lint
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const scripts = JSON.parse(readFileSync("package.json", "utf8")).scripts ?? {};
          if (!scripts.lint) {
            console.error("package.json is missing scripts.lint");
            process.exit(1);
          }
          NODE
          npm run lint
      - name: Unit tests
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const scripts = JSON.parse(readFileSync("package.json", "utf8")).scripts ?? {};
          if (!scripts.test) {
            console.error("package.json is missing scripts.test");
            process.exit(1);
          }
          NODE
          npm test

  integration:
    name: Integration tests
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - run: npm ci
      - name: Integration tests
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const scripts = JSON.parse(readFileSync("package.json", "utf8")).scripts ?? {};
          if (!scripts["test:integration"]) {
            console.error("package.json is missing scripts.test:integration");
            process.exit(1);
          }
          NODE
          npm run test:integration

  build:
    name: Build
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - run: npm ci
      - name: Build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const scripts = JSON.parse(readFileSync("package.json", "utf8")).scripts ?? {};
          if (!scripts.build) {
            console.error("package.json is missing scripts.build");
            process.exit(1);
          }
          NODE
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
