line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501", # line length handled by formatter
  "B008", # function calls in defaults (Flask/FastAPI style)
]

[lint.per-file-ignores]
"skills/*/scripts/tests/*" = ["E402"]

[format]
quote-style = "double"
