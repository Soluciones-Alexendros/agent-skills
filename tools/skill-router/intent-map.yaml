# Intent map for deterministic routing — OpenCode harness
# Used by route.py and .opencode/agents/skill-router.md
intents:
  mantenimiento:
    skills: [system-maintenance, system-health]
    patterns:
      [
        "mantenimiento",
        "limpia",
        "limpiar",
        "limpieza",
        "sistema arch",
        "optimiza",
        "paccache",
        "journal vacuum",
        "huérfanos",
        "cribar filesystem",
      ]
  salud_sistema:
    skills: [system-health]
    patterns:
      ["salud del sistema", "health check sistema", "fingerprint", "audit-full"]
  seguridad_host:
    skills: [system-security]
    patterns:
      [
        "hardening",
        "firewall",
        "apparmor",
        "auditd",
        "seguridad host",
        "forense",
      ]
  plan_continuar:
    skills: [plan-continue]
    patterns:
      [
        "por donde empiezo",
        "ciclo de vida",
        "qué hago con este repo",
        "audítalo y publícalo",
        "pon al día proyecto",
        "audita repo",
        "repo standard",
        "repo starting",
        "inicio de plan",
      ]
  release:
    skills: [project-publish]
    patterns:
      [
        "prepara release",
        "publica version",
        "changelog",
        "semver",
        "cierra repo",
      ]
  arquitectura:
    skills: [project-architecture, plan-continue]
    patterns:
      [
        "revisa la arquitectura",
        "acoplamiento",
        "deepening",
        "mapa de módulos",
        "C4",
      ]
  compliance:
    skills: [web-compliance]
    patterns: ["wcag", "gdpr", "seo", "accesibilidad", "compliance"]
  performance:
    skills: [web-performance]
    patterns: ["lighthouse", "core web vitals", "ttfb", "performance"]
  owasp:
    skills: [web-owasp]
    patterns: ["owasp", "xss", "sqli", "inyección", "vulnerabilidad código"]
  hooks:
    skills: [project-hooks]
    patterns: ["husky", "lint-staged", "pre-commit", "hooks locales"]
  backend_data:
    skills: [role-back]
    patterns:
      [
        "upstash",
        "redis",
        "qstash",
        "vector",
        "ratelimit",
        "cola",
        "blob storage",
      ]
  frontend:
    skills: [role-front]
    patterns:
      ["frontend", "estado cliente", "routing ui", "contrato api cliente"]
  design:
    skills: [role-design]
    patterns:
      ["design system", "tokens", "paleta", "tipografía", "dirección visual"]
  especificar:
    skills: [plan-specification]
    patterns: ["especificación", "spec", "desglosa tareas", "task breakdown"]
  validar_tdd:
    skills: [plan-validation]
    patterns: ["tdd", "test first", "rojo verde", "reproduce el bug"]
  proton:
    skills: [system-proton]
    patterns: ["proton mail", "proton pass", "pass-cli", "bridge imap"]
  libraries:
    skills: [project-libraries]
    patterns: ["dependencias", "cve", "sca", "sbom", "typosquatting"]
