name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  spec-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate/skill_spec.py
      - run: python3 tools/validate/skill_links.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: bash run-validation.sh --pytest-only
      - run: bash run-validation.sh --smoke-only
