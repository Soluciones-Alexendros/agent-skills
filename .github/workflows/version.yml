name: version
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Exigir bump de metadata.version en skills cambiadas
        run: python3 tools/version/bump.py --check --auto --base origin/${{ github.event.pull_request.base.ref || 'main' }}
      - name: Exigir package.json por delante del tag si cambia el circuito de release
        run: python3 tools/version/cut_tag.py --check-repo --base origin/${{ github.event.pull_request.base.ref || 'main' }}
