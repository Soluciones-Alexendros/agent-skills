name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate/skill_spec.py
      - run: python3 tools/validate/skill_links.py
      - name: Validación pre-release
        run: |
          python3 tools/validate/skill_spec.py
          python3 tools/validate/skill_links.py
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
