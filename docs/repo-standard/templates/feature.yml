name: Propuesta de mejora
description: Proponer una funcionalidad o mejora
title: "[feat] "
labels: ["type: feature"]
body:
  - type: textarea
    id: motivacion
    attributes:
      label: Problema / motivación
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptación
      placeholder: "- [ ] …"
    validations:
      required: true
