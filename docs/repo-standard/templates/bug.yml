name: Informe de bug
description: Reportar un error reproducible
title: "[bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      placeholder: Qué falla y desde cuándo
    validations:
      required: true
  - type: textarea
    id: reproduccion
    attributes:
      label: Pasos para reproducir
      placeholder: "1. … 2. …"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: Rama/tag, SO, runtime
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Salida relevante
      description: Pegar el log sin secretos
      render: text
    validations:
      required: false
